name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopistan
          POSTGRES_PASSWORD: shopistan
          POSTGRES_DB: shopistan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopistan" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
      - run: pnpm --filter @shopistan/api exec prisma generate
      - run: pnpm typecheck
      # Includes the two-tenant isolation suite and the RLS policy check.
      - run: pnpm test
      - run: pnpm build
